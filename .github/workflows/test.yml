name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: |
          /bin/bash -n enrollment-lab.sh
          /bin/bash -n launcher.sh
          /bin/bash -n docs/go
          /bin/bash -n docs/check
      - name: Run isolated fixture tests
        run: |
          python3 scripts/bundle.py --check
          python3 -m unittest discover -s tests -v
      - name: Check public CLI
        run: |
          /bin/bash enrollment-lab.sh --help
          /bin/bash enrollment-lab.sh version
