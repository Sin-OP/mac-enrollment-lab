name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: /bin/bash -n enrollment-lab.sh
      - name: Run isolated fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Check public CLI
        run: |
          /bin/bash enrollment-lab.sh --help
          /bin/bash enrollment-lab.sh version
